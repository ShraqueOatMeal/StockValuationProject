version: 2

sources:
  - name: bronze
    schema: bronze
    # Checked by `dbt source freshness`, which the Airflow DAGs run before building models.
    # Loads happen on weekdays, so a normal weekend gap is about three days.
    loaded_at_field: ingested_at
    freshness:
      warn_after: {count: 4, period: day}
      error_after: {count: 7, period: day}
    tables:
      - name: raw_market_prices
        description: "Raw daily OHLCV prices, volume, dividends, and stock splits from Yahoo Finance."
        columns:
          - name: ticker
            tests:
              - not_null
          - name: trade_date
            tests:
              - not_null

      - name: raw_yf_fundamentals
        description: "Raw JSONB income statement, balance sheet and cash flow line items from Yahoo Finance."
        columns:
          - name: ticker
            tests:
              - not_null

      - name: raw_sec_filings
        description: "Raw JSONB XBRL company facts pulled from SEC EDGAR API."
        columns:
          - name: cik
            tests:
              - not_null
          - name: form_type
            tests:
              - not_null
