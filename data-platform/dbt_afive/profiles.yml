afive_dw:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', '127.0.0.1') }}"
      port: "{{ env_var('POSTGRES_PORT', '5432') | as_number }}"
      user: "{{ env_var('POSTGRES_USER', 'afive_admin') }}"
      password: "{{ env_var('POSTGRES_PASSWORD', '177013') }}"
      dbname: "{{ env_var('POSTGRES_DB', 'afive_dw') }}"
      schema: public
      threads: 4
      keepalives_idle: 0
