version: '3.8'

x-superset-common: &superset-common
  build:
    context: ./docker/superset
  image: afive-superset:6.0.0
  environment:
    - SUPERSET_SECRET_KEY=${SUPERSET_SECRET_KEY}
    - SUPERSET_DB_PASSWORD=${SUPERSET_DB_PASSWORD}
    - SUPERSET_ADMIN_USER=${SUPERSET_ADMIN_USER:-admin}
    - SUPERSET_ADMIN_PASSWORD=${SUPERSET_ADMIN_PASSWORD}
    - WAREHOUSE_READONLY_PASSWORD=${WAREHOUSE_READONLY_PASSWORD}
    - POSTGRES_DB=${POSTGRES_DB}
  volumes:
    - ./docker/superset/superset_config.py:/app/pythonpath/superset_config.py:ro
  depends_on:
    postgres:
      condition: service_healthy

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile
  image: afive-airflow:latest
  environment:
    - AIRFLOW__CORE__EXECUTOR=LocalExecutor
    - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    - AIRFLOW__CORE__FERNET_KEY=46BKJoQYlPPOexq0OhDZnIlNepKFf87WFwLbfzqnzq8=
    - AIRFLOW__CORE__LOAD_EXAMPLES=false
    - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=true
    - PYTHONPATH=/opt/airflow
    - SEC_USER_AGENT=${SEC_USER_AGENT}
    - POSTGRES_USER=${POSTGRES_USER}
    - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    - POSTGRES_DB=${POSTGRES_DB}
    - POSTGRES_HOST=postgres
  volumes:
    - ./dags:/opt/airflow/dags
    - ./src:/opt/airflow/src
    - ./dbt_afive:/opt/airflow/dbt_afive
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_started

services:
  postgres:
    image: postgres:16-alpine
    container_name: afive_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./docker/postgres/init_schemas.sql:/docker-entrypoint-initdb.d/init_schemas.sql
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: afive_redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    container_name: afive_airflow_init
    command: version
    entrypoint: /bin/bash -c "airflow db migrate && airflow users create --username admin --firstname AFIVE --lastname Admin --role Admin --email admin@afive.local --password admin"
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    container_name: afive_airflow_webserver
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 10s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    container_name: afive_airflow_scheduler
    command: scheduler
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # One-shot: creates the Superset metadata database and the read-only warehouse role, and
  # resets both passwords to the values in .env. It runs on every `up`, so a changed
  # password in .env reaches the database without a manual step.
  superset-db-init:
    image: postgres:16-alpine
    container_name: afive_superset_db_init
    environment:
      PGHOST: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      SUPERSET_DB_PASSWORD: ${SUPERSET_DB_PASSWORD}
      WAREHOUSE_READONLY_PASSWORD: ${WAREHOUSE_READONLY_PASSWORD}
    volumes:
      - ./docker/postgres/init_superset.sh:/init_superset.sh:ro
    entrypoint: ["bash", "/init_superset.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # One-shot: migrates Superset's metadata database, creates the admin user and registers
  # the warehouse connection under the read-only role
  superset-init:
    <<: *superset-common
    container_name: afive_superset_init
    depends_on:
      postgres:
        condition: service_healthy
      superset-db-init:
        condition: service_completed_successfully
    command:
      - bash
      - -c
      - |
        superset db upgrade &&
        (superset fab create-admin --username "$$SUPERSET_ADMIN_USER" --firstname AFIVE --lastname Admin --email admin@afive.local --password "$$SUPERSET_ADMIN_PASSWORD" || true) &&
        superset init &&
        superset set-database-uri -d "AFIVE Warehouse" -u "postgresql+psycopg2://afive_readonly:$$(python -c 'import os, urllib.parse; print(urllib.parse.quote_plus(os.environ["WAREHOUSE_READONLY_PASSWORD"]))')@postgres:5432/$$POSTGRES_DB"
    restart: "no"

  superset:
    <<: *superset-common
    container_name: afive_superset
    ports:
      # Bound to this machine only; Superset is not exposed to the network
      - "127.0.0.1:${SUPERSET_PORT:-8088}:8088"
    depends_on:
      postgres:
        condition: service_healthy
      superset-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8088/health"]
      interval: 15s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  # One-shot: once the server is healthy, registers the gold tables as datasets and seeds
  # the starter dashboards. Existing dashboards are left alone unless
  # SUPERSET_REBUILD_DASHBOARDS=1 is set.
  superset-bootstrap:
    <<: *superset-common
    container_name: afive_superset_bootstrap
    environment:
      - SUPERSET_URL=http://superset:8088
      - SUPERSET_ADMIN_USER=${SUPERSET_ADMIN_USER:-admin}
      - SUPERSET_ADMIN_PASSWORD=${SUPERSET_ADMIN_PASSWORD}
      - SUPERSET_REBUILD_DASHBOARDS=${SUPERSET_REBUILD_DASHBOARDS:-0}
    volumes:
      - ./docker/superset/bootstrap_datasets.py:/app/bootstrap_datasets.py:ro
      - ./docker/superset/bootstrap_dashboards.py:/app/bootstrap_dashboards.py:ro
    command: ["bash", "-c", "python /app/bootstrap_datasets.py && python /app/bootstrap_dashboards.py"]
    depends_on:
      superset:
        condition: service_healthy
    restart: "no"

volumes:
  pgdata:
